<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Ribbon -->
  <path d="M85 20 L115 20 L120 50 L80 50 Z" fill="#c0c0c0" stroke="#a0a0a0" stroke-width="2"/>
  
  <!-- Medal outer ring -->
  <circle cx="100" cy="110" r="60" fill="url(#silverGradient)" stroke="#a0a0a0" stroke-width="3"/>
  
  <!-- Medal inner circle -->
  <circle cx="100" cy="110" r="45" fill="url(#silverInnerGradient)" stroke="#c0c0c0" stroke-width="2"/>
  
  <!-- Star in center -->
  <polygon points="100,85 105,100 120,100 108,110 113,125 100,115 87,125 92,110 80,100 95,100" 
           fill="#a0a0a0" stroke="#808080" stroke-width="1"/>
  
  <!-- Highlight on medal -->
  <ellipse cx="85" cy="95" rx="15" ry="8" fill="rgba(255,255,255,0.4)"/>
  
  <!-- Gradients -->
  <defs>
    <radialGradient id="silverGradient" cx="0.3" cy="0.3">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="70%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </radialGradient>
    <radialGradient id="silverInnerGradient" cx="0.3" cy="0.3">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </radialGradient>
  </defs>
</svg>