<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Past Prediction Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h1>UFC<br>Prediction Scoreboard</h1>
    
    <a href="index.html" class="nav-link">View Upcoming Predictions</a>

    <main id="app">
        
        <section id="insights-container">
            <h2>Model Insights</h2>
        </section>
            <div id="insights-table-container">
                <div class="insights-table-wrapper">
                    <!-- The table will be rendered here by JavaScript -->
                </div>
            </div>


        <section id="results-container">
            <h2>Past Event Results</h2>
        </section>
    </main>

    <div id="past-events">
        <p>Loading results...</p>
    </div>

    <!-- Your custom script -->
    <script type="module" src="static/past_results.js"></script>

    <!-- Floating Timestamp Info -->
    <div class="floating-info">
        <div class="last-run">
            <strong>Last Run:</strong> <span id="last-run-timestamp">Loading...</span>
        </div>
        <div class="last-updated">
            <strong>Last Updated:</strong> <span id="last-updated-timestamp">Loading...</span>
        </div>
        <div class="contact-info">
            <a href="mailto:ufcpredicting@gmail.com">ufcpredicting@gmail.com</a>
        </div>
    </div>
</body>
</html>
