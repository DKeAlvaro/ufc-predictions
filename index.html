<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Fight Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>UFC Fight Predictor</h1>
        <div class="input-group">
            <div class="input-container">
                <input type="text" id="fighter1" placeholder="Enter Fighter 1 Name" autocomplete="off">
                <div id="suggestions1" class="suggestions"></div>
            </div>
            <div class="input-container">
                <input type="text" id="fighter2" placeholder="Enter Fighter 2 Name" autocomplete="off">
                <div id="suggestions2" class="suggestions"></div>
            </div>
        </div>
        <button id="predictBtn">Predict Winner</button>
        <div id="result" class="result-container">
            <p></p>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
