name: Update UFC Data Pipeline

on:
  schedule:
    # Run once a day (at 00:00 UTC)
    - cron: '0 0 * * *'
  
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

# Grant write permissions to the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Update last run timestamp
      run: |
        # Always update the last run timestamp
        mkdir -p data
        echo "{\"last_run\": \"$(date -u -Iseconds)\"}" > data/last_run.json
        
    - name: Run UFC data update pipeline
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        cd src
        python update_data.py
        
    - name: Commit and push updated data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Always add the last_run.json file
        git add data/last_run.json
        
        # Check if there are other data changes
        git add data/*.json
        
        # Determine commit message based on what changed
        if git diff --staged --name-only | grep -E "(upcoming_predictions|past_event_results)\.json" > /dev/null; then
          # Data was actually updated
          git commit -m "🤖 Auto-update UFC data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "✅ Data updated and committed"
        else
          # Only last_run was updated (no new events)
          git commit -m "🕐 Update last run timestamp - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🕐 No new events found, only updating last run timestamp"
        fi
        
        git push
        
    - name: Display update summary
      run: |
        echo "✅ UFC data pipeline completed successfully!"
        echo "📅 Last run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        ls -la data/ 