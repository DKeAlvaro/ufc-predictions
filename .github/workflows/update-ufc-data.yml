name: Update UFC Data Pipeline

on:
  schedule:
    # Run every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run UFC data update pipeline
      run: |
        cd src
        python update_data.py
        
    - name: Commit and push updated data
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add any changed data files
        git add data/*.json
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No data changes to commit"
        else
          git commit -m "🤖 Auto-update UFC data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push
        fi
        
    - name: Display update summary
      run: |
        echo "✅ UFC data pipeline completed successfully!"
        echo "📅 Last run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        ls -la data/ 